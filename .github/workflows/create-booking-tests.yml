
name: CreateBooking Tests

on:
  push:
    branches:
      - task-4-create-booking
  pull_request:
    branches:
      - main

jobs:
  test-create-booking:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Generate protobuf bindings
        run: make gen

      - name: Prepare databases
        run: |
          mysql -h 127.0.0.1 -u root -ptestpassword < event_service/schema.sql
          mysql -h 127.0.0.1 -u root -ptestpassword < registration_service/schema.sql

      - name: Configure test database passwords
        run: |
          .venv/bin/python - <<'PY'
          import json

          for path in [
              "event_service/config.json",
              "registration_service/config.json",
          ]:
              with open(path) as file:
                  config = json.load(file)

              config["db"]["password"] = "testpassword"

              with open(path, "w") as file:
                  json.dump(config, file)
          PY

      - name: Test CreateBooking API
        run: |
          (cd event_service && PYTHONPATH=generated ../.venv/bin/python server.py) > event.log 2>&1 &
          (cd registration_service && PYTHONPATH=generated ../.venv/bin/python server.py) > registration.log 2>&1 &
          (cd gateway && PYTHONPATH=generated ../.venv/bin/python app.py) > gateway.log 2>&1 &

          trap 'cat event.log registration.log gateway.log' EXIT

          .venv/bin/python - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "http://127.0.0.1:8080/api/v1"

          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = Request(
                  BASE + path,
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method=method,
              )
              try:
                  with urlopen(req, timeout=5) as response:
                      return response.status, json.load(response)
              except HTTPError as error:
                  return error.code, json.load(error)

          for attempt in range(30):
              try:
                  status, _ = api("GET", "/events/2")
                  if status == 200:
                      break
              except (URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise AssertionError("Gateway did not start")

          status, event = api("GET", "/events/2")
          assert status == 200
          assert event["available_seats"] == 4

          status, booking = api("POST", "/registrations", {
              "event_id": 2,
              "participant_id": 4
          })
          assert status == 201, (status, booking)
          assert booking["event_id"] == 2
          assert booking["participant_id"] == 4
          assert booking["participant_name"] == "Dana"
          assert booking["booking_id"] > 0
          print("PASS: Booking created with HTTP 201")

          status, event = api("GET", "/events/2")
          assert status == 200
          assert event["available_seats"] == 3
          print("PASS: Available seats decreased")

          status, _ = api("POST", "/registrations", {
              "event_id": 2,
              "participant_id": 4
          })
          assert status == 409
          print("PASS: Duplicate booking rejected")

          status, event = api("GET", "/events/2")
          assert status == 200
          assert event["available_seats"] == 3
          print("PASS: Duplicate did not consume another seat")

          status, _ = api("POST", "/registrations", {
              "event_id": 2,
              "participant_id": 999
          })
          assert status == 404
          print("PASS: Unknown participant rejected")

          status, _ = api("POST", "/registrations", {
              "event_id": 999,
              "participant_id": 5
          })
          assert status == 404
          print("PASS: Unknown event rejected")

          status, _ = api("POST", "/registrations", {
              "event_id": 3,
              "participant_id": 1
          })
          assert status == 201
          print("PASS: Last available seat booked")

          status, _ = api("POST", "/registrations", {
              "event_id": 3,
              "participant_id": 2
          })
          assert status == 409
          print("PASS: Full event rejected")

          status, _ = api("POST", "/registrations", {
              "event_id": "invalid",
              "participant_id": 4
          })
          assert status == 400
          print("PASS: Invalid request rejected")

          status, _ = api("POST", "/registrations", {})
          assert status == 400
          print("PASS: Missing fields rejected")

          print("All CreateBooking tests passed")
          PY
